[project]
name = "engram"
version = "0.0.1"
description = "Engram: language models with memory in the network (research preview)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Matthew Mangano" }, { name = "Engram contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Model-side baselines (dense retrieval, B4 per-user LoRA). Pick exactly one torch flavour:
#   local CPU:  uv sync --extra dev --extra ml --extra cpu
#   AWS GPU:    uv sync --extra dev --extra ml --extra cu130
ml = ["transformers>=5", "peft>=0.21", "sentence-transformers>=6", "accelerate>=1.10"]
# B5 Mem0 with its keyword search and lemmatiser; also needs the ml extra for local embeddings.
# spaCy's English model is a separate download: uv run python -m spacy download en_core_web_sm
baselines = ["mem0ai[nlp]>=2.2", "fastembed>=0.3.1"]
corpus = ["datasets>=4"]  # engram-corpus fetch (Phase 1 corpus)
cpu = ["torch>=2.14"]
cu130 = ["torch>=2.14"]

[project.scripts]
engram-bench = "engram.cli:main"
engram-compute = "engram.compute:main"
engram-measure = "engram.measure:main"
engram-serve = "engram.models.serve:main"
engram-corpus = "engram.corpus.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
