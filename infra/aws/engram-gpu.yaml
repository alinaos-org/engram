AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Engram Phase 0 GPU support resources: a private bucket for run results, an instance role that
  allows SSM access (no SSH keys, no inbound ports) and writes to that bucket only, a no-ingress
  security group, and a monthly budget with email alerts. GPU instances themselves are launched
  and terminated by scripts/aws/gpu.sh, never by this stack.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the GPU instances (the default VPC is fine).
  AlertEmail:
    Type: String
    Description: Where budget alerts go.
  MonthlyBudgetUsd:
    Type: Number
    Default: 300
    Description: Monthly budget for resources tagged Project=engram.

Resources:
  RunsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub engram-runs-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: engram

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub engram-gpu-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: engram-runs-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt RunsBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${RunsBucket.Arn}/*
      Tags:
        - Key: Project
          Value: engram

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub engram-gpu-${AWS::Region}
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: engram-gpu
      GroupDescription: Engram GPU instances - no inbound access; reach them through SSM.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: engram

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: engram-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        # Needs the "Project" cost allocation tag activated in Billing; until then this filter
        # matches nothing, so also watch the account-wide budget.
        CostFilters:
          TagKeyValue:
            - user:Project$engram
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  RunsBucketName:
    Value: !Ref RunsBucket
  InstanceProfileName:
    Value: !Ref InstanceProfile
  SecurityGroupId:
    Value: !GetAtt SecurityGroup.GroupId
